<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="LC-di-yan — AI 应用 · 多智能体系统 · 全栈开发">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset="0.55" stop-color="#0B1226"/>
      <stop offset="1" stop-color="#0A0F1E"/>
    </linearGradient>
    <radialGradient id="auroraA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#8B5CF6" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.35" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#0EA5E9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <mask id="gridMask">
      <radialGradient id="gridFade" cx="0.5" cy="0.5" r="0.75">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
        <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
      <rect width="1200" height="340" fill="url(#gridFade)"/>
    </mask>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
    <filter id="nameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#38BDF8" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background layers -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <ellipse cx="1000" cy="40" rx="520" ry="360" fill="url(#auroraA)"/>
  <ellipse cx="80" cy="340" rx="460" ry="320" fill="url(#auroraB)"/>
  <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)" opacity="0.55"/>
  <text x="620" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="210" font-weight="700" letter-spacing="10" fill="#FFFFFF" opacity="0.02">AGENT</text>
  <rect width="1200" height="340" filter="url(#noise)" opacity="0.5"/>

  <!-- corner brackets -->
  <g stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1.5" fill="none">
    <path d="M22 46V22H46"/>
    <path d="M1178 46V22H1154"/>
    <path d="M22 294V318H46"/>
    <path d="M1178 294V318H1154"/>
  </g>

  <!-- status pill -->
  <g>
    <rect x="984" y="18" width="192" height="26" rx="13" fill="#0F172A" fill-opacity="0.6" stroke="#1E293B"/>
    <circle cx="1002" cy="31" r="3.5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="1014" y="35.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" fill="#9FB3C8">AGENT CORE · ONLINE</text>
  </g>

  <!-- left text block -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="70" font-size="15" letter-spacing="3" fill="#7DD3FC">~/github · AI ENGINEER</text>
    <rect x="346" y="56" width="9" height="17" fill="#7DD3FC">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="70" y="162" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="80" font-weight="800" letter-spacing="-2" fill="url(#nameGrad)" filter="url(#nameGlow)">LC-di-yan</text>
  <rect x="72" y="184" width="150" height="4" rx="2" fill="url(#accent)" opacity="0.35"/>
  <rect x="72" y="184" width="150" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="72" y="184" width="34" height="4" rx="2" fill="#E0F2FE">
    <animate attributeName="x" values="72;188;72" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="72" y="236" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="24" fill="#CBD5E1">AI 应用 · 多智能体系统 · 全栈开发</text>
  <text x="72" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#64748B">github.com/LC-di-yan</text>

  <!-- agent core viz -->
  <g>
    <!-- rotating dashed rings -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 930 168" to="360 930 168" dur="36s" repeatCount="indefinite"/>
      <circle cx="930" cy="168" r="96" fill="none" stroke="#818CF8" stroke-opacity="0.35" stroke-dasharray="3 10" stroke-width="1.2"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 930 168" to="0 930 168" dur="52s" repeatCount="indefinite"/>
      <circle cx="930" cy="168" r="134" fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-dasharray="2 14" stroke-width="1"/>
    </g>
    <circle cx="930" cy="168" r="58" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1"/>

    <!-- data flow connectors -->
    <g stroke="#38BDF8" stroke-opacity="0.30" stroke-width="1.2" stroke-dasharray="3 9">
      <path d="M930 168 L806 78"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.6s" repeatCount="indefinite"/></path>
      <path d="M930 168 L1054 74"><animate attributeName="stroke-dashoffset" values="0;-72" dur="3.1s" repeatCount="indefinite"/></path>
      <path d="M930 168 L1096 186"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.9s" repeatCount="indefinite"/></path>
      <path d="M930 168 L812 248"><animate attributeName="stroke-dashoffset" values="0;-72" dur="3.4s" repeatCount="indefinite"/></path>
      <path d="M930 168 L994 288"><animate attributeName="stroke-dashoffset" values="0;-72" dur="3.7s" repeatCount="indefinite"/></path>
    </g>

    <!-- pulse rings -->
    <circle cx="930" cy="168" r="40" fill="none" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.2">
      <animate attributeName="r" values="40;118" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.45;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="168" r="40" fill="none" stroke="#818CF8" stroke-opacity="0.40" stroke-width="1.2">
      <animate attributeName="r" values="40;118" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.40;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- orbiting particles -->
    <circle r="3" fill="#67E8F9" opacity="0.9">
      <animateMotion dur="9s" repeatCount="indefinite" path="M930 168 m-96 0 a96 96 0 1 1 192 0 a96 96 0 1 1 -192 0"/>
    </circle>
    <circle r="2.4" fill="#A5B4FC" opacity="0.8">
      <animateMotion dur="14s" repeatCount="indefinite" path="M930 168 m-134 0 a134 134 0 1 0 268 0 a134 134 0 1 0 -268 0"/>
    </circle>

    <!-- core orb -->
    <circle cx="930" cy="168" r="40" fill="url(#core)" opacity="0.95"/>
    <circle cx="930" cy="168" r="40" fill="none" stroke="#7DD3FC" stroke-opacity="0.8" stroke-width="1.2"/>
    <path d="M957.7 184 L930 200 L902.3 184 L902.3 152 L930 136 L957.7 152 Z" fill="none" stroke="#A5B4FC" stroke-opacity="0.55" stroke-width="1"/>
    <text x="930" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#E0F2FE">AGENT</text>

    <!-- nodes -->
    <g fill="#0B1220" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.2">
      <circle cx="806" cy="78" r="6"/>
      <circle cx="1054" cy="74" r="6"/>
      <circle cx="1096" cy="186" r="6"/>
      <circle cx="812" cy="248" r="6"/>
      <circle cx="994" cy="288" r="6"/>
    </g>
    <g fill="#67E8F9">
      <circle cx="806" cy="78" r="2"/>
      <circle cx="1054" cy="74" r="2"/>
      <circle cx="1096" cy="186" r="2"/>
      <circle cx="812" cy="248" r="2"/>
      <circle cx="994" cy="288" r="2"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5E7A9C" text-anchor="middle">
      <text x="806" y="60">LLM</text>
      <text x="1054" y="56">RAG</text>
      <text x="1096" y="212">TOOLS</text>
      <text x="812" y="274">MEMORY</text>
      <text x="994" y="314">MCP</text>
    </g>
  </g>

  <!-- sweeping shimmer -->
  <g transform="rotate(-18 600 170)">
    <rect x="-600" y="-160" width="380" height="640" fill="url(#shimmer)">
      <animate attributeName="x" values="-600;1500" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bottom accent bar -->
  <rect x="0" y="330" width="1200" height="1" fill="#38BDF8" opacity="0.25"/>
  <rect x="0" y="332" width="1200" height="8" fill="url(#accent)">
    <animate attributeName="opacity" values="0.95;0.75;0.95" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
